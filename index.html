<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Estação Jaú-1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: uma tela 16:9 de pixel art (320x180 ampliada) com textos HTML por cima; controles discretos embaixo. */
:root{
  --void:#04060e;      /* fundo da página */
  --hull:#141a38;      /* parede da estação */
  --ink:#d9e2ff;       /* texto principal */
  --dim:#7c88b8;       /* texto secundário */
  --phosphor:#7cf5d0;  /* texto dos monitores */
  --amber:#ffc75a;     /* destaque / hora */
  --tricolor:#e3262d;  /* São Paulo */
  --paper:#f4f7ff;     /* balão de fala */
  --f-label:"Silkscreen", "Courier New", monospace;
  --f-body:"VT323", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px;box-sizing:border-box;overflow-x:hidden}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
#full{display:flex;align-items:center;justify-content:center;width:100%;background:var(--void)}
#full:fullscreen{width:100vw;height:100vh}
#full:-webkit-full-screen{width:100vw;height:100vh}
#stage{position:relative;width:640px;height:360px;max-width:100%;overflow:hidden;--u:2px;background:var(--hull)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;box-sizing:border-box;pointer-events:none}
.lbl{font-family:var(--f-label);font-size:calc(var(--u)*4.2);letter-spacing:.06em;line-height:1;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.txt{font-family:var(--f-body);font-size:calc(var(--u)*6.4);line-height:.95;color:var(--phosphor)}
.panel{padding:calc(var(--u)*2.2) calc(var(--u)*2.6);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);overflow:hidden}
#badge{color:#5d6aa0;font-size:calc(var(--u)*3.6)}
#pClock .time{font-family:var(--f-label);font-weight:700;font-size:calc(var(--u)*13);color:var(--amber);line-height:.9;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#pClock .row{display:flex;justify-content:space-between;align-items:baseline}
#pClock .date{font-size:calc(var(--u)*6.4);color:var(--phosphor)}
#pWeather{padding-left:calc(var(--u)*19)}
#pWeather .temp{font-family:var(--f-label);font-size:calc(var(--u)*8);color:var(--ink);line-height:.9}
#pWeather .txt{font-size:calc(var(--u)*5.4)}
#pGame .lbl{color:#ff8a8f}
#pGame .vs{font-family:var(--f-label);font-size:calc(var(--u)*4.6);color:var(--ink);line-height:1.15;white-space:nowrap}
#pGame .txt{font-size:calc(var(--u)*5.6)}
#pGame .count{color:var(--amber)}
#pAgenda ul{font-size:calc(var(--u)*5.8);list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
#pAgenda li{display:flex;gap:calc(var(--u)*2.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pAgenda li .h{color:var(--dim);font-variant-numeric:tabular-nums}
#pAgenda li.past{opacity:.38}
#pAgenda li.next{color:var(--amber)}
#pAgenda li.next .h{color:var(--amber)}
#pAgenda li.next::before{content:"\25B8";margin-right:calc(var(--u)*-1.4)}
#board{padding:calc(var(--u)*2.4) calc(var(--u)*2);display:flex;flex-direction:column;gap:calc(var(--u)*2.4)}
.note{overflow-wrap:break-word;word-break:break-word;font-family:var(--f-body);font-size:calc(var(--u)*5.6);line-height:.9;color:#1b1630;padding:calc(var(--u)*1.6) calc(var(--u)*1.6) calc(var(--u)*2.2);box-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 rgba(0,0,0,.35)}
.note:nth-child(2){background:#ffe27a;transform:rotate(-2deg)}
.note:nth-child(3){background:#ff9ec4;transform:rotate(1.5deg)}
.note:nth-child(4){background:#8ff0c8;transform:rotate(-1deg)}
#plaque{display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:calc(var(--u)*4)}
#ticker{background:#070b1c;border-top:calc(var(--u)*1) solid #2c3770;display:flex;align-items:center;overflow:hidden}
#ticker .tag{flex:none;background:var(--amber);color:#1a1300;font-family:var(--f-label);font-size:calc(var(--u)*4);padding:0 calc(var(--u)*2.4);height:100%;display:flex;align-items:center;letter-spacing:.06em;position:relative;z-index:1}
#ticker .lane{flex:1;overflow:hidden;white-space:nowrap}
#track{display:inline-block;padding-left:100%;font-size:calc(var(--u)*7);color:var(--ink);animation:scroll 70s linear infinite}
#track span{margin-right:calc(var(--u)*14)}
#track span::before{content:"\25C6";color:var(--amber);margin-right:calc(var(--u)*3)}
@keyframes scroll{to{transform:translateX(-100%)}}
#bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:#10163a;font-family:var(--f-body);font-size:calc(var(--u)*6);line-height:.9;padding:calc(var(--u)*1.4) calc(var(--u)*2.4);max-width:calc(var(--u)*92);box-shadow:0 0 0 calc(var(--u)*.8) #10163a, calc(var(--u)*1.2) calc(var(--u)*1.2) 0 calc(var(--u)*.8) rgba(0,0,0,.4);pointer-events:none;z-index:3}
#bubble b{font-family:var(--f-label);font-size:calc(var(--u)*3.6);display:block;color:#4a55a0;letter-spacing:.06em;margin-bottom:calc(var(--u)*.8)}
#bubble::after{content:"";position:absolute;left:50%;bottom:calc(var(--u)*-2.4);width:calc(var(--u)*2.4);height:calc(var(--u)*2.4);background:var(--paper);box-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 #10163a;transform:translateX(-50%)}
#hit{position:absolute;cursor:pointer;border-radius:50%}
#hit:focus-visible{outline:2px dashed var(--amber)}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;max-width:960px}
.bar button{font-family:var(--f-label);font-size:12px;letter-spacing:.06em;background:#151c3c;color:var(--ink);border:2px solid #2c3770;padding:7px 12px;cursor:pointer}
.bar button:hover{border-color:var(--amber);color:var(--amber)}
.bar button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bar button.red{border-color:#7a1f2a}
.hint{font-size:19px;color:var(--dim);text-align:center;line-height:1.05}
.hint kbd{font-family:var(--f-label);font-size:11px;color:var(--ink);border:1px solid #2c3770;padding:1px 5px}
@media (prefers-reduced-motion: reduce){#track{animation-duration:160s}}
/* modo TV: link com #tv no final — só a cena, sem botões */
body.tv{padding:0}
body.tv .bar,body.tv .hint{display:none}
body.tv #wrap{gap:0;height:100%;justify-content:center}
</style>

<div id="wrap">
  <div id="full">
    <div id="stage">
      <canvas id="cv" width="320" height="180"></canvas>

      <div class="ov lbl" id="badge">Protótipo · dados de exemplo</div>

      <div class="ov" id="board">
        <div class="lbl">Lembretes</div>
      </div>

      <div class="ov panel" id="pClock">
        <div class="row"><span class="lbl">Estação Jaú-1</span><span class="lbl">Brasília</span></div>
        <div class="time" id="time">00:00</div>
        <div class="date txt" id="date">—</div>
      </div>

      <div class="ov panel" id="pWeather">
        <div class="lbl">Planeta natal</div>
        <div class="temp" id="temp">--°</div>
        <div class="txt" id="wtext">—</div>
      </div>

      <div class="ov panel" id="pGame">
        <div class="lbl">Tricolor</div>
        <div class="vs" id="vs">SPFC × —</div>
        <div class="txt" id="gwhen">—</div>
        <div class="txt count" id="gcount">—</div>
      </div>

      <div class="ov panel" id="pAgenda">
        <div class="lbl" id="agendaTitle">Agenda · hoje</div>
        <ul class="txt" id="agenda"></ul>
      </div>

      <div class="ov lbl" id="plaque">Órbita · Terra</div>

      <div class="ov" id="ticker">
        <div class="tag">Transmissão da Terra</div>
        <div class="lane"><div id="track"></div></div>
      </div>

      <div id="bubble" hidden></div>
      <div id="hit" tabindex="0" role="button" aria-label="Viajar para outro planeta"></div>
    </div>
  </div>

  <div class="bar">
    <button id="bTravel" type="button">Viajar</button>
    <button id="bPrev" type="button">◄ Planeta</button>
    <button id="bNext" type="button">Planeta ►</button>
    <button id="bVisit" type="button">Visita especial</button>
    <button id="bGoal" type="button" class="red">Gol do Tricolor</button>
    <button id="bFull" type="button">Tela cheia</button>
  </div>
  <p class="hint">No controle da TV: <kbd>OK</kbd> viaja · <kbd>◄</kbd> <kbd>►</kbd> troca de planeta · botão <kbd>verde</kbd> chama uma visita · <kbd>vermelho</kbd> comemora gol</p>
</div>

<script>
(function () {
'use strict';

/* ================================================================
   DADOS DE EXEMPLO
   Na versão de verdade, isso vem do "cérebro" na internet:
   clima (Open-Meteo, Jaú), Google Agenda, notícias, jogos do SPFC
   e os lembretes criados pela Alexa.
   ================================================================ */
function nextSaturday16() {
  var d = new Date(); var add = (6 - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + add); d.setHours(16, 0, 0, 0);
  if (d.getTime() < Date.now() - 2 * 3600e3) d.setDate(d.getDate() + 7);
  return d;
}
var DADOS = {
  cidade: 'Jaú',
  clima: { temp: 27, max: 31, min: 18, cond: 'sol', texto: 'Céu limpo' },
  agenda: [
    { h: '09:00', t: 'Revisar artes do cliente' },
    { h: '14:30', t: 'Call de alinhamento' },
    { h: '19:00', t: 'Academia' },
    { h: '21:30', t: 'Ver o episódio novo' }
  ],
  lembretes: ['Comprar café', 'Pagar a conta de luz', 'Regar as plantas'],
  jogo: { casa: 'SÃO PAULO', fora: 'ADVERSÁRIO', quando: nextSaturday16(), local: 'Morumbis' },
  noticias: [
    'Exemplo: sonda europeia envia novas imagens das luas de Júpiter',
    'Exemplo: fabricantes apresentam celulares dobráveis mais finos',
    'Exemplo: conferência do clima reúne quase 200 países',
    'Exemplo: IA ajuda cientistas a mapear o fundo do oceano',
    'Exemplo: nova missão tripulada à Lua tem data confirmada'
  ]
};

/* ================================================================ */
var W = 320, H = 180, TAU = Math.PI * 2;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
var stage = document.getElementById('stage');
var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function two(n) { return (n < 10 ? '0' : '') + n; }
function hexRGB(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
function pack(r, g, b) { return ((255 << 24) | ((b & 255) << 16) | ((g & 255) << 8) | (r & 255)) >>> 0; }
function packHex(h) { var c = hexRGB(h); return pack(c[0], c[1], c[2]); }
function shades(h) {
  var c = hexRGB(h);
  return [pack(c[0], c[1], c[2]),
          pack(c[0] * .78, c[1] * .78, c[2] * .82),
          pack(c[0] * .5, c[1] * .5, c[2] * .6),
          pack(c[0] * .1 + 4, c[1] * .1 + 6, c[2] * .14 + 14)];
}
function place(el, x, y, w, h) {
  el.style.left = (x / W * 100) + '%'; el.style.top = (y / H * 100) + '%';
  if (w != null) el.style.width = (w / W * 100) + '%';
  if (h != null) el.style.height = (h / H * 100) + '%';
}

/* ---------------- ruído (para texturas dos planetas) ---------------- */
function hash(x, y, z, s) {
  var h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1274126177) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z, s) {
  var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  var xf = x - xi, yf = y - yi, zf = z - zi;
  var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  function L(a, b, t) { return a + (b - a) * t; }
  return L(
    L(L(hash(xi, yi, zi, s), hash(xi + 1, yi, zi, s), u), L(hash(xi, yi + 1, zi, s), hash(xi + 1, yi + 1, zi, s), u), v),
    L(L(hash(xi, yi, zi + 1, s), hash(xi + 1, yi, zi + 1, s), u), L(hash(xi, yi + 1, zi + 1, s), hash(xi + 1, yi + 1, zi + 1, s), u), v), w);
}
function fbm(x, y, z, s, o) {
  var a = 0, amp = .5, f = 1, n = 0;
  for (var i = 0; i < o; i++) { a += amp * vnoise(x * f, y * f, z * f, s + i * 17); n += amp; amp *= .5; f *= 2; }
  return a / n;
}

/* ---------------- planetas ---------------- */
var TW = 256, TH = 128;
function makeTex(fn) {
  var t = new Uint8Array(TW * TH);
  for (var j = 0; j < TH; j++) for (var i = 0; i < TW; i++) {
    var lon = i / TW * TAU, lat = (.5 - (j + .5) / TH) * Math.PI;
    var x = Math.cos(lat) * Math.cos(lon), y = Math.sin(lat), z = Math.cos(lat) * Math.sin(lon);
    t[j * TW + i] = fn(x, y, z, lat, lon);
  }
  return t;
}
var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
var LX = -.55, LY = -.45, LZ = .70;
(function () { var l = Math.sqrt(LX * LX + LY * LY + LZ * LZ); LX /= l; LY /= l; LZ /= l; })();

function makeDisk(R) {
  var S = 2 * R + 1, idx = [], us = [], vs = [], lv = [], rim = [];
  for (var py = 0; py < S; py++) for (var px = 0; px < S; px++) {
    var x = (px - R) / R, y = (py - R) / R, d2 = x * x + y * y;
    if (d2 > 1) continue;
    var nz = Math.sqrt(1 - d2), lon = Math.atan2(x, nz), lat = -Math.asin(y);
    var u = Math.floor((lon / TAU + .5) * TW) & (TW - 1);
    var v = Math.min(TH - 1, Math.floor((.5 - lat / Math.PI) * TH));
    var s = x * LX + y * LY + nz * LZ + (BAYER[(px & 3) + (py & 3) * 4] / 16 - .5) * .16;
    idx.push(py * S + px); us.push(u); vs.push(v);
    lv.push(s > .45 ? 0 : s > .14 ? 1 : s > -.06 ? 2 : 3);
    rim.push(Math.sqrt(d2) > 1 - 1.6 / R ? 1 : 0);
  }
  return { S: S, n: idx.length, idx: new Uint32Array(idx), u: new Uint8Array(us), v: new Uint8Array(vs), lv: new Uint8Array(lv), rim: new Uint8Array(rim) };
}

var CLOUD = 250, CITY = packHex('#ffd36b');
function genEarth(P) {
  P.tex = makeTex(function (x, y, z, lat) {
    var e = fbm(x * 1.7 + 3, y * 1.7, z * 1.7, 11, 5), al = Math.abs(lat);
    if (al > 1.28 || (al > 1.08 && e > .46)) return 6;
    if (e > .52) { if (e > .6) return 5; return fbm(x * 4, y * 4, z * 4, 21, 3) > .55 ? 4 : 3; }
    if (e > .49) return 2;
    if (e > .41) return 1;
    return 0;
  });
  P.cloud = makeTex(function (x, y, z) { return fbm(x * 3.2, y * 4.6, z * 3.2, 41, 4) > .605 ? 1 : 0; });
  P.lights = makeTex(function (x, y, z, lat, lon) { return hash(Math.floor(lon * 30), Math.floor(lat * 30), 0, 77) > .7 ? 1 : 0; });
  P.mats = [
    ['#1f4ea8', '#183f8c', '#112d66', '#071530'], ['#2b66c9', '#2152a8', '#163a7a', '#09193a'],
    ['#3f8fe0', '#2f74c2', '#205290', '#0b1f42'], ['#4fae55', '#3c8c46', '#2a6236', '#0d1c1c'],
    ['#c4a65c', '#9e8448', '#6d5b33', '#1a1916'], ['#8f8064', '#73664f', '#4f4637', '#16151b'],
    ['#f2f6ff', '#c9d6ee', '#8c9cc0', '#262f4c']
  ].map(function (a) { return a.map(packHex); });
  P.cloudMat = ['#ffffff', '#dfe6f5', '#97a3c2', '#232a44'].map(packHex);
  P.atmo = packHex('#a8dcff');
}
function genMoon(P) {
  var cr = [];
  for (var i = 0; i < 46; i++) {
    var a = rnd(0, TAU), b = Math.asin(rnd(-1, 1));
    cr.push([Math.cos(b) * Math.cos(a), Math.sin(b), Math.cos(b) * Math.sin(a), rnd(.05, .22)]);
  }
  P.tex = makeTex(function (x, y, z) {
    for (var i = 0; i < cr.length; i++) {
      var c = cr[i], d = Math.acos(Math.max(-1, Math.min(1, x * c[0] + y * c[1] + z * c[2])));
      if (d < c[3]) return 3; if (d < c[3] * 1.3) return 2;
    }
    return fbm(x * 1.8, y * 1.8, z * 1.8, 3, 4) < .42 ? 1 : 0;
  });
  P.mats = ['#c9c9d1', '#8b8b97', '#e4e4ec', '#a7a7b2'].map(shades);
  P.atmo = 0;
}
function genMars(P) {
  P.tex = makeTex(function (x, y, z, lat) {
    if (Math.abs(lat) > 1.25) return 3;
    var n = fbm(x * 2, y * 2, z * 2, 5, 5);
    if (Math.abs(lat + .15 + (fbm(x * 6, y * 6, z * 6, 9, 2) - .5) * .25) < .035 && x > 0) return 4;
    return n < .42 ? 1 : n > .56 ? 2 : 0;
  });
  P.mats = ['#c1532f', '#8e3a24', '#dd7a4a', '#f3e9e0', '#5e2418'].map(shades);
  P.atmo = packHex('#f0a07a');
}
function bands(colors, seed, turb, spot) {
  return function (P) {
    P.tex = makeTex(function (x, y, z, lat, lon) {
      if (spot) {
        var dl = Math.atan2(Math.sin(lon - spot[0]), Math.cos(lon - spot[0])) / spot[2], dp = (lat - spot[1]) / spot[3], e = dl * dl + dp * dp;
        if (e < .55) return colors.length; if (e < 1) return colors.length + 1;
      }
      var b = Math.floor((Math.sin(lat) * colors.length * .9 + (fbm(x * 3, y * 9, z * 3, seed, 4) - .5) * turb) + 100);
      return b % colors.length;
    });
    var all = colors.slice(); if (spot) { all.push(spot[4], spot[5]); }
    P.mats = all.map(shades);
  };
}
var genJupiter = bands(['#ead6b2', '#c4946a', '#f3e6cf', '#b07a52', '#dcb88c', '#a06a48'], 31, 1.6, [2.0, -.36, .34, .14, '#c2523a', '#e3967a']);
var genSaturn = bands(['#ecdcaa', '#d4bc84', '#f2e6c0', '#c7aa70'], 51, .7, null);
var genNeptune = bands(['#3e66d8', '#4f7be6', '#2f50b8', '#6a93ee'], 61, .9, [1.0, -.3, .3, .12, '#1b2c78', '#2c45a8']);

/* ---------- planetas inventados (gerados na hora) ---------- */
function hsl(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  function hx(v) { var q = Math.max(0, Math.min(255, Math.round((v + m) * 255))).toString(16); return q.length < 2 ? '0' + q : q; }
  return '#' + hx(r) + hx(g) + hx(b);
}
var SILABAS = ['ka', 'zu', 'tor', 'li', 'vex', 'no', 'ran', 'qui', 'bo', 'sel', 'tri', 'mo', 'xa', 'ju', 'pe', 'dra', 'go', 'nim'];
function alienName() {
  var n = pick(SILABAS) + pick(SILABAS) + (Math.random() < .4 ? pick(SILABAS) : '');
  return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + pick(['b', 'c', 'd', 'IX', 'VII', '7', '42', 'Prime']);
}

function buildPlanet(P) {

  P.buf = new Uint32Array(P.img.data.buffer);

function renderPlanet(P) {

  var rot = Math.floor(P.rot) & (TW - 1), crot = Math.floor(P.crot) & (TW - 1);
  for (var k = 0; k < d.n; k++) {
    var row = d.v[k] * TW, tu = (d.u[k] + rot) & (TW - 1), m = tex[row + tu], lv = d.lv[k], col;
    if (cl && cl[row + ((d.u[k] + crot) & (TW - 1))]) col = P.cloudMat[lv];
    else if (lv === 3 && li && m >= 3 && m <= 5 && li[row + tu]) col = CITY;
    else col = mats[m][lv];
    if (P.glow === m) col = mats[m][0];
    if (P.atmo && d.rim[k] && lv < 2) col = P.atmo;
    buf[d.idx[k]] = col;
  }
  P.pctx.putImageData(P.img, 0, 0);
}

  var bc = back.getContext('2d'), fc = front.getContext('2d');
  var cols = ['#e8d6a0', '#c9b07a', '#f2e4b8', '#b39a68'];
  for (var py = 0; py < S; py++) for (var px = 0; px < S; px++) {
    var x = px - RO, y = py - RO, rr = Math.sqrt(x * x + (y / .3) * (y / .3)) / R;

    if (!p) { bubble.who = null; bubble.el.hidden = true; return; }
    var bx = Math.max(30, Math.min(W - 30, p.x)), by = p.y - 4;
    bubble.el.style.left = (bx / W * 100) + '%'; bubble.el.style.top = (by / H * 100) + '%';
  }
}

/* dados reais: data.json é atualizado a cada 30 min pelo GitHub Actions */
function sigla(s) { return s === 'SAO' ? 'SPFC' : s; }
function aplicarDados(d) {
  if (!d) return;
  if (d.clima) DADOS.clima = d.clima;
  if (d.noticias && d.noticias.length) DADOS.noticias = d.noticias;
  if (d.jogos) {
    var p = d.jogos.proximo;
    DADOS.jogo = p ? {
      fora: p.emCasa ? p.fora : p.casa,
      vs: sigla(p.siglaCasa) + ' × ' + sigla(p.siglaFora),
      quando: new Date(p.quando),
      local: p.campeonato || p.local
    } : null;
    var u = d.jogos.ultimo;
    DADOS.ultimo = u && u.placar ? sigla(u.siglaCasa) + ' ' + u.placar + ' ' + sigla(u.siglaFora) : null;
  }
  DADOS.real = true;
  renderEstatico(); tick();
  if (d.privado) abrirPrivado(d.privado);
}
/* agenda e lembretes: chegam criptografados; a chave vem uma vez pelo link (#tv&chave=...) e fica salva na TV */
var CHAVE = null;
(function () {
  var m = /chave=([A-Za-z0-9]+)/.exec(location.hash);
  try { if (m) localStorage.setItem('estacao-chave', m[1]); CHAVE = m ? m[1] : localStorage.getItem('estacao-chave'); }
  catch (e) { CHAVE = m ? m[1] : null; }
  if (m && history.replaceState) history.replaceState(null, '', location.pathname + (location.hash.indexOf('#tv') === 0 ? '#tv' : ''));
})();
function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function avisar(t) { DADOS.aviso = t; renderEstatico(); }
function abrirPrivado(p) {
  if (!CHAVE) { avisar('Agenda trancada: falta a chave'); return; }
  if (!window.crypto || !crypto.subtle || !window.TextEncoder) { avisar('Esta TV não abre a agenda'); return; }
  crypto.subtle.importKey('raw', new TextEncoder().encode(CHAVE), { name: 'PBKDF2' }, false, ['deriveKey'])
    .then(function (base) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.sal), iterations: 60000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
    .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(p.iv) }, k, b64(p.dados)); })
    .then(function (buf) { aplicarAgenda(JSON.parse(new TextDecoder().decode(buf)).eventos || []); })
    .catch(function () { avisar('Chave da agenda incorreta'); });
}
function aplicarAgenda(evs) {
  var agora = Date.now(), d = new Date(), ini = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), fimHoje = ini + 864e5;
  function rotulo(ms, hora) {
    var x = new Date(ms), mesmoDia = ms >= ini && ms < fimHoje;
    return (mesmoDia ? '' : DIAS[x.getDay()] + ' ') + (hora ? two(x.getHours()) + ':' + two(x.getMinutes()) : '');
  }
  var timed = evs.filter(function (e) { return !e.diaInteiro; }).map(function (e) { return { ms: Date.parse(e.inicio), fim: Date.parse(e.fim), t: e.titulo }; });
  var hoje = timed.filter(function (e) { return e.ms < fimHoje && e.fim > ini; });
  var temFuturoHoje = hoje.some(function (e) { return e.ms > agora; });
  var lista;
  if (temFuturoHoje) {
    var primeiro = 0; for (var i = 0; i < hoje.length; i++) if (hoje[i].ms > agora) { primeiro = Math.max(0, i - 1); break; }
    lista = hoje.slice(primeiro, primeiro + 4);
    // completa com os próximos dias, se o dia estiver vazio
    lista = lista.concat(timed.filter(function (e) { return e.ms >= fimHoje; }).slice(0, 4 - lista.length));
    document.getElementById('agendaTitle').textContent = 'Agenda · hoje';
  } else {
    lista = timed.filter(function (e) { return e.ms > agora; }).slice(0, 4);
    document.getElementById('agendaTitle').textContent = 'Agenda · próximos';
  }
  DADOS.agenda = lista.map(function (e) { return { ms: e.ms, h: rotulo(e.ms, true), t: e.t }; });
  DADOS.lembretes = evs.filter(function (e) { return e.diaInteiro && Date.parse(e.fim) > agora && Date.parse(e.inicio) < agora + 7 * 864e5; })
    .map(function (e) { var r = rotulo(Math.max(Date.parse(e.inicio), ini), false); return (r ? r.trim() + ': ' : '') + e.titulo; });
  DADOS.agendaReal = true; DADOS.aviso = '';
  renderLembretes(); renderEstatico(); tick();
}
function carregar() {
  if (!window.fetch || location.protocol === 'file:') return;
  fetch('data.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).then(aplicarDados).catch(function () {});
}

var agendaEl = document.getElementById('agenda');
function tick() {
  var d = new Date();
  document.getElementById('time').textContent = two(d.getHours()) + ':' + two(d.getMinutes());
  document.getElementById('date').textContent = DIAS[d.getDay()] + ', ' + d.getDate() + ' ' + MESES[d.getMonth()] + ' · ' + DADOS.clima.texto.toLowerCase();
  document.getElementById('gcount').textContent = countdown(false);
  var now = d.getTime(), nextDone = false;
  agendaEl.innerHTML = '';
  if (!DADOS.agenda.length) { var vazio = document.createElement('li'); vazio.textContent = 'Nada marcado'; agendaEl.appendChild(vazio); }
  DADOS.agenda.forEach(function (a) {
    var li = document.createElement('li');
    if (a.ms <= now) li.className = 'past'; else if (!nextDone) { li.className = 'next'; nextDone = true; }
    var h = document.createElement('span'); h.className = 'h'; h.textContent = a.h;
    var t = document.createElement('span'); t.textContent = a.t;
    li.appendChild(h); li.appendChild(t); agendaEl.appendChild(li);
  });
}

function fit() {
  var fs = document.fullscreenElement || document.webkitFullscreenElement, aw, ah;
  if (fs || document.body.classList.contains('tv')) { aw = window.innerWidth; ah = window.innerHeight; }
  else { aw = document.getElementById('wrap').clientWidth; ah = window.innerHeight - 110; }
  var w = Math.min(aw, Math.max(200, ah) * 16 / 9);
  if (w >= 640) w = Math.floor(w / 320) * 320;
  stage.style.width = w + 'px'; stage.style.height = (w * 9 / 16) + 'px';
  stage.style.setProperty('--u', (w / 320) + 'px');
}

function toggleFull() {
  var el = document.getElementById('full');
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      var r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (r && r.catch) r.catch(function () {});
    }
  } catch (e) {}
}

document.addEventListener('keydown', function (e) {
  var k = e.keyCode;
  if (k === 13 && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
  if (k === 13) { startTravel(travel.cur === 0 ? randomDest() : 0); e.preventDefault(); }
  else if (k === 37) { startTravel(travel.cur - 1); e.preventDefault(); }
  else if (k === 39) { startTravel(travel.cur + 1); e.preventDefault(); }
  else if (k === 403 || k === 71) { goal(); }
  else if (k === 404 || k === 86) { spawnVisitor(); }  // botão verde / tecla V       // botão vermelho do controle LG / tecla G
  else if (k === 70) { toggleFull(); }               // tecla F
});

requestAnimationFrame(loop);
})();
